#
# BIRD dev with Auto Ontology: the one place Gym pins Auto Ontology.
#
# - build_image.sh builds the catalog image from this commit of Auto Ontology's repository.
# - This project is the prepare project of catalog_tools.yaml: its prepare writes Auto Ontology's own prompt and tool
#   definitions, at this commit, into the rows.
#
# The pin is Auto Ontology's main (a630ebd) plus the commit of NVIDIA/auto-ontology#543, which accepts the openai
# version nemo-gym pins. Move it to NVIDIA/auto-ontology once #543 merges.

[project]
name = "gym-birdbench-auto-ontology"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym",
    "bm25s",
    "nltk",
    "auto-ontology-server @ git+https://github.com/ffrujeri/auto-ontology.git@e774af9f21aa1dc39efe4b054b0c199561bd2ee9",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=5.17.0",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
]
exclude-dependencies = [
    "fasttext-wheel",
    "blinker",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "werkzeug",
    "waitress",
    "diskcache",
]
required-version = ">=0.13.4"

[tool.uv.sources]
"nemo-gym" = { path = "../../..", editable = true }

[tool.uv.sources.nemo-lens]
git = "https://github.com/NVIDIA-NeMo/Lens.git"
rev = "4d045c03186b90afdc815db46b671f6a21bc7e98"
